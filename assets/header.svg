<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Hussain Mansoor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#7cf5ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00d9ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .name { font: 700 64px 'Segoe UI', Arial, Helvetica, sans-serif; fill: #ffffff; opacity: 0; animation: rise 1s ease-out 0.2s forwards; }
      .sym  { font: 700 34px Consolas, 'Courier New', monospace; fill: #00d9ff; opacity: 0.18; animation: float 6s ease-in-out infinite; }
      .s2 { animation-delay: -1.5s; }
      .s3 { animation-delay: -3s; }
      .s4 { animation-delay: -4.5s; }
      @keyframes rise  { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    </style>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>
  <circle cx="180" cy="90" r="150" fill="url(#glow)"/>
  <circle cx="830" cy="170" r="170" fill="url(#glow)"/>

  <text class="sym" x="70" y="80">&lt;/&gt;</text>
  <text class="sym s2" x="880" y="70">{ }</text>
  <text class="sym s3" x="150" y="190">;</text>
  <text class="sym s4" x="820" y="200">01</text>
  <text class="sym s2" x="500" y="48" text-anchor="middle">( )</text>

  <text class="name" x="500" y="145" text-anchor="middle">Hussain Mansoor</text>

  <g>
    <path d="M0 225 Q125 195 250 225 T500 225 T750 225 T1000 225 T1250 225 T1500 225 L1500 260 L0 260 Z" fill="#00d9ff" fill-opacity="0.10">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M0 238 Q125 212 250 238 T500 238 T750 238 T1000 238 T1250 238 T1500 238 L1500 260 L0 260 Z" fill="#00d9ff" fill-opacity="0.16">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
